apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: nextcloud-tls
  namespace: nextcloud
spec:
  secretName: nextcloud-tls
  duration: 2160h    # 90d
  renewBefore: 720h  # 30d — auto-renew, no manual action (design §3 TLS)
  privateKey:
    algorithm: ECDSA
    size: 256
  # Renamed from nextcloud.itguys.ro 2026-09-03.
  #
  # Note this cert is NOT what serves the site: edge-proxy (ns `ingress`,
  # k3s-cluster repo) terminates TLS with its own `edge-mesh-tls`, whose SAN
  # list carries this hostname. This Certificate is left from the retired
  # per-namespace nginx-tls-proxy and is kept only so the name resolves to a
  # valid cert if anything in this namespace ever terminates TLS again.
  dnsNames:
    - cloud.itguys.ro
  issuerRef:
    name: letsencrypt-cloudflare
    kind: ClusterIssuer
