name: Deploy nextcloud

# Push to main → path-filtered apply against the in-cluster k3s API via the
# runner pod's ServiceAccount (`arc-itguys-ro-nextcloud-gha-rs-no-permission`,
# bound to Role `nextcloud-deployer` in ns nextcloud and Role `cf-token-writer`
# in ns cert-manager — see manifests/bootstrap/11-ci-deployer-rbac.yaml).
#
# `secrets` always runs (cheap, idempotent). `manifests` and `helm` jobs run
# only when their respective paths changed (or workflow_dispatch reconcile_all).
#
# PARTIAL MIGRATION, on purpose. The applying and installing jobs are shims over
# dustfeather/shared-workflows (deploy-k8s.yml and deploy-helm.yml); `secrets`
# stays hand-written and always will. Its five Secrets do not fit any KEY=VALUE
# input: one is a `patch --type=merge` into a DIFFERENT namespace against a Role
# that permits update on one name only, and one is a `--from-file` SSH key.
# Expressing those through a shared workflow would mean widening its surface for
# a single caller. This is the carve-out issue #18 recorded for this repo.

on:
  push:
    branches: [main]
    paths:
      - 'helm/**'
      - 'manifests/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      reconcile_all:
        description: "Apply everything (helm + manifests + secrets) regardless of paths"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-nextcloud
  cancel-in-progress: false

env:
  KUBE_NS: nextcloud

jobs:
  changes:
    runs-on: arc-itguys-ro-nextcloud
    outputs:
      helm: ${{ steps.f.outputs.helm }}
      manifests: ${{ steps.f.outputs.manifests }}
      # Chart coordinates live here rather than in workflow-level `env:` because
      # a reusable-workflow `with:` block cannot read the `env` context — only
      # `github`, `needs`, `vars` and `inputs`. Emitting them once as outputs
      # keeps the validation gate and the deploy on the same chart version;
      # copying the literals into both shims would let them drift, and a gate
      # that lints a different version than the one being installed is worse
      # than no gate, because it is green.
      chart: ${{ steps.chart.outputs.chart }}
      chart-version: ${{ steps.chart.outputs.version }}
      repo-url: ${{ steps.chart.outputs.repo-url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
      - id: f
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            helm:
              - 'helm/**'
              - '.github/workflows/deploy.yml'
            manifests:
              - 'manifests/*.yaml'
              - '!manifests/60-nginx-tls-proxy.yaml'
      - id: chart
        run: |
          set -euo pipefail
          {
            echo "chart=nextcloud/nextcloud"
            echo "version=9.1.0"
            echo "repo-url=https://nextcloud.github.io/helm/"
          } >> "$GITHUB_OUTPUT"

  secrets:
    runs-on: arc-itguys-ro-nextcloud
    steps:
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - name: Verify in-cluster auth (SelfSubjectAccessReview, no RBAC needed)
        run: |
          set -euo pipefail
          kubectl auth can-i update secret/cloudflare-api-token -n cert-manager
          kubectl auth can-i create secret -n nextcloud
          kubectl auth can-i create deployment.apps -n nextcloud
      - name: Render and apply Secret/cloudflare-api-token (cert-manager)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${CF_API_TOKEN:?missing GH secret CF_API_TOKEN}"
          # Patch in place (Role permits update only on this name).
          kubectl -n cert-manager patch secret cloudflare-api-token \
            --type=merge \
            -p "{\"stringData\":{\"api-token\":\"${CF_API_TOKEN}\"}}"
      - name: Render and apply nextcloud-admin
        env:
          NEXTCLOUD_ADMIN_USERNAME: ${{ secrets.NEXTCLOUD_ADMIN_USERNAME }}
          NEXTCLOUD_ADMIN_PASSWORD: ${{ secrets.NEXTCLOUD_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          : "${NEXTCLOUD_ADMIN_USERNAME:?missing}"
          : "${NEXTCLOUD_ADMIN_PASSWORD:?missing}"
          kubectl -n "${KUBE_NS}" apply --server-side -f - <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: nextcloud-admin
            namespace: ${KUBE_NS}
          type: Opaque
          stringData:
            nextcloud-username: "${NEXTCLOUD_ADMIN_USERNAME}"
            nextcloud-password: "${NEXTCLOUD_ADMIN_PASSWORD}"
          EOF
      - name: Render and apply nextcloud-db
        env:
          MARIADB_ROOT_PASSWORD: ${{ secrets.MARIADB_ROOT_PASSWORD }}
          MARIADB_USERNAME: ${{ secrets.MARIADB_USERNAME }}
          MARIADB_PASSWORD: ${{ secrets.MARIADB_PASSWORD }}
        run: |
          set -euo pipefail
          : "${MARIADB_ROOT_PASSWORD:?missing}"
          : "${MARIADB_USERNAME:?missing}"
          : "${MARIADB_PASSWORD:?missing}"
          kubectl -n "${KUBE_NS}" apply --server-side -f - <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: nextcloud-db
            namespace: ${KUBE_NS}
          type: Opaque
          stringData:
            mariadb-root-password: "${MARIADB_ROOT_PASSWORD}"
            db-username: "${MARIADB_USERNAME}"
            db-password: "${MARIADB_PASSWORD}"
          EOF
      - name: Render and apply valkey-auth
        env:
          VALKEY_PASSWORD: ${{ secrets.VALKEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${VALKEY_PASSWORD:?missing}"
          kubectl -n "${KUBE_NS}" apply --server-side -f - <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: valkey-auth
            namespace: ${KUBE_NS}
          type: Opaque
          stringData:
            redis-password: "${VALKEY_PASSWORD}"
          EOF
      - name: Render and apply backup-ssh
        env:
          BACKUP_SSH_PRIVATE_KEY: ${{ secrets.BACKUP_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${BACKUP_SSH_PRIVATE_KEY:?missing}"
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          # Write key to a file so the YAML heredoc can embed it via `|`
          # without quoting headaches.
          printf '%s\n' "$BACKUP_SSH_PRIVATE_KEY" > "$tmp"
          kubectl create secret generic backup-ssh \
            -n "${KUBE_NS}" \
            --from-file=id_ed25519="$tmp" \
            --dry-run=client -o yaml \
            | kubectl apply --server-side -f -

  validate-manifests:
    # Schema gate. Client dry-run only (never --server) so nothing is written,
    # but note `kubectl apply --dry-run=client` is NOT offline: apply still GETs
    # the live object to compute the merge patch. Every invocation therefore
    # needs a namespace the deployer SA can read — either stamped in the file's
    # metadata or passed as `-n "${KUBE_NS}"`. Without it kubectl falls back to
    # the runner pod's own namespace (arc-runners), where the SA has no rights.
    # manifests/60-nginx-tls-proxy.yaml is excluded on purpose — it is applied
    # out-of-band (see CLAUDE.md), so it is not part of the CI-scoped manifest
    # set.
    #
    # Stays hand-written: deploy-k8s.yml applies for real and has no dry-run
    # mode, which is the right call for a deploy workflow and the wrong one for
    # a gate.
    runs-on: arc-itguys-ro-nextcloud
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
      - name: Validate CI-scoped manifests (client dry-run)
        run: |
          set -euo pipefail
          for f in \
            manifests/20-certificate.yaml \
            manifests/30-mariadb.yaml \
            manifests/40-valkey.yaml \
            manifests/50-nextcloud-pvcs.yaml \
            manifests/70-backup-cronjob.yaml; do
            echo "::group::validate $f"
            kubectl apply --dry-run=client -f "$f"
            echo "::endgroup::"
          done

  # The chart gate. Same workflow as the `helm` job below, called with
  # `upgrade: false` — it lints and renders and writes nothing.
  validate-chart:
    needs: changes
    permissions:
      contents: read
    uses: dustfeather/shared-workflows/.github/workflows/deploy-helm.yml@v4
    with:
      namespace: nextcloud
      release: nextcloud
      chart: ${{ needs.changes.outputs.chart }}
      chart-version: ${{ needs.changes.outputs.chart-version }}
      repo-url: ${{ needs.changes.outputs.repo-url }}
      values-files: helm/nextcloud-values.yaml
      runner: arc-itguys-ro-nextcloud
      setup-kubectl: true
      lint: true
      template-check: true
      upgrade: false

  manifests:
    needs: [changes, secrets, validate-manifests, validate-chart]
    if: ${{ needs.changes.outputs.manifests == 'true' || inputs.reconcile_all }}
    permissions:
      contents: read
    uses: dustfeather/shared-workflows/.github/workflows/deploy-k8s.yml@v4
    with:
      namespace: nextcloud
      runner: arc-itguys-ro-nextcloud
      setup-kubectl: true
      # `none`, not the `get` default: the deployer SA holds a namespace-scoped
      # Role, and reading a Namespace is a cluster-scoped verb it does not have.
      ensure-namespace: none
      # CI-scoped only — excludes bootstrap/ and the shared nginx proxy, which
      # is applied out of band. Every file stamps `namespace: nextcloud`, so
      # the shared workflow's `-n` agrees with them rather than fighting them.
      manifests: |
        manifests/20-certificate.yaml
        manifests/30-mariadb.yaml
        manifests/40-valkey.yaml
        manifests/50-nextcloud-pvcs.yaml
        manifests/70-backup-cronjob.yaml
      # The non-chart Deployments. One timeout covers both, so valkey now gets
      # mariadb's 3m rather than its old 2m — a wider budget on a wait that
      # already passed, not a behaviour change anyone can observe.
      rollout-targets: |
        deploy/nextcloud-mariadb
        deploy/valkey
      rollout-timeout: 3m

  helm:
    needs: [changes, secrets, validate-manifests, validate-chart]
    if: ${{ needs.changes.outputs.helm == 'true' || inputs.reconcile_all }}
    permissions:
      contents: read
    uses: dustfeather/shared-workflows/.github/workflows/deploy-helm.yml@v4
    with:
      namespace: nextcloud
      release: nextcloud
      chart: ${{ needs.changes.outputs.chart }}
      chart-version: ${{ needs.changes.outputs.chart-version }}
      repo-url: ${{ needs.changes.outputs.repo-url }}
      values-files: helm/nextcloud-values.yaml
      runner: arc-itguys-ro-nextcloud
      setup-kubectl: true
      atomic: true
      helm-timeout: 5m
      rollout-targets: deploy/nextcloud
      rollout-timeout: 5m
